version: "3.9"

services:
  lumina:
    build: .
    container_name: lumina-ai
    ports:
      - "8000:8000"   # FastAPI (REST + WebSocket + UI)
      - "8001:8001"   # MCP Server (JSON-RPC 2.0)
    env_file:
      - .env
    volumes:
      - lumina-data:/app/data   # Persist SQLite database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  lumina-data:
    driver: local
